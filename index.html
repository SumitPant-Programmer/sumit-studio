<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sumit Studio</title>
<style>
:root{--bg:#fafaf7;--fg:#1c1b22;--muted:#6b6a75;--card:#fff;--line:#e6e4dc;--accent:#5b3df5;--accent-fg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14131a;--fg:#f2f1f7;--muted:#a09fae;--card:#1e1d27;--line:#2c2b38;--accent:#8b78ff;--accent-fg:#14131a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14131a;--fg:#f2f1f7;--muted:#a09fae;--card:#1e1d27;--line:#2c2b38;--accent:#8b78ff;--accent-fg:#14131a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:800;font-size:20px;cursor:pointer}
.logo span{color:var(--accent)}
.links{display:flex;gap:6px}
.links button,.menu{background:none;border:0;color:var(--muted);font:inherit;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.links button.on{background:var(--accent);color:var(--accent-fg)}
.menu{display:none;font-size:22px}
.hero{padding:90px 0 60px;text-align:center}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.1;margin:0 0 16px}
.hero h1 span{color:var(--accent)}
.hero p{max-width:560px;margin:0 auto 28px;color:var(--muted);font-size:18px}
.btn{background:var(--accent);color:var(--accent-fg);border:0;font:inherit;font-weight:700;padding:12px 26px;border-radius:999px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;padding-bottom:70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.card h3{margin:8px 0}.card p{color:var(--muted);margin:0}
.icon{font-size:30px}
.page{padding:60px 0 70px}
.page h2{font-size:34px;margin:0 0 12px}
.page p{color:var(--muted);max-width:640px}
.stats{display:flex;gap:30px;flex-wrap:wrap;margin-top:26px}
.stats b{display:block;font-size:30px;color:var(--accent)}
form{display:grid;gap:12px;max-width:480px;margin-top:20px}
input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.ok{background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:16px;max-width:480px}
footer{border-top:1px solid var(--line);padding:24px 0;text-align:center;color:var(--muted);font-size:14px}
@media (max-width:640px){
.menu{display:block}
.links{display:none;position:absolute;top:64px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;padding:10px 20px}
.links.open{display:flex}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState } = React;
const html = htm.bind(React.createElement);

function Navbar({ page, go }) {
  const [open, setOpen] = useState(false);
  const pages = ["Home", "About", "Contact"];
  return html`
    <nav><div class="wrap bar">
      <div class="logo" onClick=${() => go("Home")}>Sumit<span> Studio</span></div>
      <button class="menu" onClick=${() => setOpen(!open)}>☰</button>
      <div class=${"links" + (open ? " open" : "")}>
        ${pages.map(p => html`
          <button key=${p} class=${page === p ? "on" : ""}
            onClick=${() => { go(p); setOpen(false); }}>${p}</button>`)}
      </div>
    </div></nav>`;
}

function Home({ go }) {
  const services = [
    { icon: "🎨", title: "Design", text: "Clean, modern interfaces that people enjoy using." },
    { icon: "⚡", title: "Development", text: "Fast websites that look great on every screen." },
    { icon: "🚀", title: "Launch", text: "From idea to a live, shareable link in no time." }
  ];
  return html`
    <div class="wrap">
      <section class="hero">
        <h1>We build <span>beautiful</span> websites</h1>
        <p>Sumit Studio turns ideas into modern, responsive web experiences.</p>
        <button class="btn" onClick=${() => go("Contact")}>Get in touch</button>
      </section>
      <div class="grid">
        ${services.map(s => html`
          <div class="card" key=${s.title}>
            <div class="icon">${s.icon}</div><h3>${s.title}</h3><p>${s.text}</p>
          </div>`)}
      </div>
    </div>`;
}

function About() {
  return html`
    <div class="wrap page">
      <h2>About us</h2>
      <p>Sumit Studio is a small creative studio focused on simple, good-looking and
      fast websites. We believe a great website should be easy to build, easy to use
      and a pleasure to look at.</p>
      <div class="stats">
        <div><b>25+</b>Projects</div><div><b>100%</b>Responsive</div><div><b>24/7</b>Online</div>
      </div>
    </div>`;
}

function Contact() {
  const [sent, setSent] = useState(false);
  const [name, setName] = useState("");
  const submit = e => { e.preventDefault(); setSent(true); };
  return html`
    <div class="wrap page">
      <h2>Contact</h2>
      <p>Have a project in mind? Send us a message.</p>
      ${sent
        ? html`<div class="ok">Thanks ${name}! Your message was received. ✅</div>`
        : html`<form onSubmit=${submit}>
            <input required placeholder="Your name" value=${name}
              onInput=${e => setName(e.target.value)} />
            <input required type="email" placeholder="Your email" />
            <textarea required rows="4" placeholder="Your message"></textarea>
            <button class="btn" type="submit">Send message</button>
          </form>`}
    </div>`;
}

function App() {
  const [page, setPage] = useState("Home");
  const go = p => { setPage(p); window.scrollTo(0, 0); };
  return html`
    <${Navbar} page=${page} go=${go} />
    <main>
      ${page === "Home" && html`<${Home} go=${go} />`}
      ${page === "About" && html`<${About} />`}
      ${page === "Contact" && html`<${Contact} />`}
    </main>
    <footer>© 2026 Sumit Studio · Made by Sumit</footer>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
